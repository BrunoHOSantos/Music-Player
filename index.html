<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Music Player desenvolvido com HTML, CSS e JavaScript"
    >

    <title>Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="player-container">

        <!-- =========================
             CABEÇALHO
        ========================== -->

        <header class="player-header">

            <h1>🎵 Music Player</h1>

            <p>
                Player De Bruno
            </p>

        </header>


        <!-- =========================
             CAPA DA MÚSICA
        ========================== -->

        <section class="album">

            <img
                id="cover"
                src="assets/images/cover1.jpg"
                alt="Capa da música"
            >

        </section>


        <!-- =========================
             INFORMAÇÕES DA MÚSICA
        ========================== -->

        <section class="song-info">

            <h2 id="song-title">
                Música 1
            </h2>

            <p id="song-artist">
                Artista 1
            </p>

        </section>


        <!-- =========================
             ÁUDIO
        ========================== -->

        <audio id="audio"></audio>


        <!-- =========================
             PROGRESSO
        ========================== -->

        <section class="progress-container">

            <span id="current-time">
                0:00
            </span>

            <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0"
            >

            <span id="duration">
                0:00
            </span>

        </section>


        <!-- =========================
             CONTROLES
        ========================== -->

        <section class="controls">

            <button
                id="previous"
                class="control-button"
                aria-label="Música anterior"
            >
                ⏮
            </button>


            <button
                id="play"
                class="play-button"
                aria-label="Reproduzir"
            >
                ▶
            </button>


            <button
                id="next"
                class="control-button"
                aria-label="Próxima música"
            >
                ⏭
            </button>

        </section>


        <!-- =========================
             VOLUME
        ========================== -->

        <section class="volume-container">

            <span>
                🔊
            </span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
                aria-label="Volume"
            >

        </section>


        <!-- =========================
             PLAYLIST
        ========================== -->

        <section class="playlist-section">

            <h3>
                Playlist
            </h3>

            <div id="playlist"></div>

        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
